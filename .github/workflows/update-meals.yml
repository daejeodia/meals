name: 식단 자동 갱신

on:
  schedule:
    - cron: '0 * * * *'   # 매시 정각 (24시간) - 운영자가 저녁 늦게 올리는 경우 대비
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-meals
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 이번 주 / 다음 주 식단 받기
        run: |
          today=$(TZ=Asia/Seoul date +%F)
          dow=$(TZ=Asia/Seoul date +%u)
          for offset in 0 7; do
            monday=$(date -d "$today -$((dow-1)) days +${offset} days" +%Y%m%d)
            url="https://daonna.net/get_weekly_meals?date=${monday}&rest_id=4"
            if curl -fsS --max-time 20 "$url" -o /tmp/meals.json \
               && jq -e 'type == "array"' /tmp/meals.json > /dev/null; then
              # 이미 내용이 있는 파일을 빈 배열로 덮어쓰지 않음(다온나 일시 오류 대비)
              if [ "$(jq length /tmp/meals.json)" = "0" ] && [ -s "${monday}.json" ] \
                 && [ "$(jq length "${monday}.json")" != "0" ]; then
                echo "건너뜀(빈 응답, 기존 유지): ${monday}"
              else
                jq -c . /tmp/meals.json > "${monday}.json"
                echo "저장: ${monday}.json"
              fi
            else
              echo "건너뜀(받기 실패): ${monday}"
            fi
          done
          cutoff=$(date -d "$today -21 days" +%Y%m%d)
          for f in [0-9]*.json; do
            [ -e "$f" ] || continue
            name=$(basename "$f" .json)
            if [ "$name" \< "$cutoff" ]; then rm -f "$f"; fi
          done

      - name: 바뀐 게 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A .
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "식단 자동 갱신"
            git push
          fi

      # 봇(GITHUB_TOKEN)이 한 push는 Pages 배포를 자동으로 일으키지 않아서
      # 이 워크플로우가 직접 Pages에 배포한다.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
